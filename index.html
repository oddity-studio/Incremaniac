<meta charset="utf-8">
<title>INCREMANIAC™ — Artificial General Insolvency</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="styles/tycoon.css">

<div id="app">

  <!-- ===== TOP HUD ===== -->
  <header id="hud">
    <div class="hud-brand">
      <div class="logo">INCREMANIAC<sup>™</sup></div>
      <div class="tagline" id="company-name">UNNAMED VENTURE, INC.</div>
    </div>
    <div class="hud-readouts" id="hud-readouts"></div>
    <div class="hud-power">
      <div class="aip-label">A.I. POWER</div>
      <div class="aip-value" id="aip-value">0.00</div>
      <div class="aip-state" id="aip-state">NOMINAL</div>
    </div>
  </header>

  <!-- ===== FORMULA STRIP ===== -->
  <div id="formula-strip" title="The Grand Incremental Formula">
    <span class="f-term" data-t="ram">RAM</span><span class="f-op">×</span><span
      class="f-paren">(</span><span class="f-term" data-t="money">MONEY</span><span
      class="f-op">−</span><span class="f-term" data-t="ego">EGO</span><span class="f-paren">)</span><span
      class="f-op">×</span><span class="f-term" data-t="elec">ELEC</span>
    <span class="f-div">÷</span>
    <span class="f-paren">(</span><span class="f-term" data-t="water">WATER</span><span
      class="f-op">−</span><span class="f-term" data-t="cha">CHARISMA</span><span class="f-paren">)</span>
    <span class="f-eq">=</span><span class="f-term f-out" data-t="aip">AI POWER</span>
  </div>

  <div id="body">
    <!-- ===== LEFT NAV ===== -->
    <nav id="nav"></nav>

    <!-- ===== SCREEN ===== -->
    <main id="screen"></main>
  </div>

  <!-- ===== BOTTOM TICKER ===== -->
  <footer id="ticker-bar">
    <div class="ticker-label">STONKS</div>
    <div class="ticker-viewport"><div class="ticker-track" id="ticker-track"></div></div>
  </footer>
</div>

<div id="toasts"></div>

<script type="module" src="src/main.js"></script>
